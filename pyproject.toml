[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garblo-backend"
version = "0.1.0"
description = "Garblo AI lookbook backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain-openai>=0.3,<1",
  "openai>=1.60,<2",
  "passlib[bcrypt]>=1.7,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
garblo-api = "garblo.main:run"
garblo-worker = "garblo.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/garblo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"


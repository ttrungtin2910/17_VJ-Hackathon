x-runtime: &runtime
  build: {context: ..}
  image: ${COMPOSE_PROJECT_NAME:-garblo-local-wsl}-backend:local
  env_file: ${GARBLO_ENV_FILE:-.env}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cần .env local}
      POSTGRES_DB: ${POSTGRES_DB:-garblo}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    command: [/data]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Cần .env local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Cần .env local}
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports: ['127.0.0.1:${MEDIA_PORT:-19000}:9000']
    volumes: [rustfs-data:/data]
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '3', http://localhost:9000/health]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  storage-init:
    <<: *runtime
    command: [python, -m, garblo.storage_init]
    depends_on:
      rustfs: {condition: service_healthy}
    restart: 'no'

  migrate:
    <<: *runtime
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'

  api:
    <<: *runtime
    ports: ['127.0.0.1:${API_PORT:-18080}:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s

  worker:
    deploy:
      replicas: ${GARBLO_WORKER_REPLICAS:-1}
    <<: *runtime
    command: [garblo-worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, garblo.local_runtime, worker]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s

  web:
    image: ${COMPOSE_PROJECT_NAME:-garblo-local-wsl}-web:local
    build:
      context: ../../garblo-frontend
      args:
        VITE_DATA_MODE: real
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18080/v1}
    ports: ['127.0.0.1:${WEB_PORT:-5173}:80']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  rustfs-data:
